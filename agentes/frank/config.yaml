# Configuração mínima. O instalador ajusta o provedor e o modelo escolhidos pelo aluno.
model:
  provider: openrouter
  default: ""

# O Hermes só oferece as ferramentas do Kanban (kanban_create, kanban_list...) ao perfil que pede o
# toolset "kanban" de forma explícita. Sem isso o Frank não consegue passar tarefa ao time.
# Listas gravadas pelo próprio Hermes 0.21.5 com "hermes -p frank tools enable kanban --platform X".
platform_toolsets:
  cli: [browser, clarify, code_execution, computer_use, connections, cronjob, delegation, file, image_gen, kanban, memory, session_search, skills, terminal, todo, tts, vision, web]
  telegram: [browser, clarify, code_execution, computer_use, connections, cronjob, delegation, file, image_gen, kanban, memory, session_search, skills, terminal, todo, tts, vision, web]
  api_server: [browser, code_execution, connections, cronjob, delegation, file, image_gen, kanban, memory, session_search, skills, terminal, todo, vision, web]
  cron: [browser, clarify, code_execution, computer_use, connections, cronjob, delegation, file, image_gen, kanban, memory, session_search, skills, terminal, todo, tts, vision, web]

# Pedidos de aprovação no Telegram em português e áudio do dono transcrito como português.
display:
  language: pt
stt:
  language: pt
# Banco de conhecimento da empresa: o Frank cria e preenche no onboarding; todos leem pela skill consultar-banco.
skills:
  config:
    banco:
      dir: /home/hermes/empresa/banco
  auto_load:
    - consultar-banco
