name: breno
version: 0.1.0
description: "Breno, Gestor de Tráfego: lê a conta de anúncios, sugere ajustes e executa só o que o dono aprovar."
hermes_requires: ">=0.21.0"
author: "Imersão Time de Agentes de IA"
license: "Uso dos alunos da imersão"

env_requires:
  - name: OPENROUTER_API_KEY
    description: "Chave do OpenRouter (cérebro do agente). Pode ficar vazia se você usar outro provedor."
    required: false
    default: ""
